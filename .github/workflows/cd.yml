name: Continuous Deployment

'on':
  push:
    branches: [ main ]
    paths:
      - 'portfolio/**'
  workflow_dispatch:

concurrency:
  group: production-cd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci

      - name: Run verification checks
        working-directory: portfolio
        run: npm run check

      - name: Build portfolio
        working-directory: portfolio
        run: npm run build

      - name: Package release archive
        id: package
        working-directory: portfolio
        run: |
          RELEASE_NAME="$(date -u +'%Y%m%d%H%M%S')-01"
          ARCHIVE_NAME="dist-${RELEASE_NAME}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C dist .
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload release archive to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        run: |
          USER_NAME="${VPS_USER:-ubuntu}"
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes "${USER_NAME}@${VPS_HOST}" "mkdir -p ~/deploy/diezaster"
          scp -o StrictHostKeyChecking=no -o BatchMode=yes "portfolio/${ARCHIVE_NAME}" "${USER_NAME}@${VPS_HOST}:/home/${USER_NAME}/deploy/diezaster/"

      - name: Promote release on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_NAME: ${{ steps.package.outputs.release_name }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        run: |
          USER_NAME="${VPS_USER:-ubuntu}"
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes "${USER_NAME}@${VPS_HOST}" bash -s -- "${RELEASE_NAME}" "${ARCHIVE_NAME}" "${USER_NAME}" << 'EOF'
            set -e
            RELEASE_NAME="$1"
            ARCHIVE_NAME="$2"
            VPS_USER="$3"

            TARGET_DIR="/var/www/diezaster/releases/${RELEASE_NAME}"
            ARCHIVE="/home/${VPS_USER}/deploy/diezaster/${ARCHIVE_NAME}"

            sudo mkdir -p "$TARGET_DIR"
            sudo tar -xzf "$ARCHIVE" -C "$TARGET_DIR"
            sudo chown -R www-data:www-data "$TARGET_DIR"
            sudo find "$TARGET_DIR" -type d -exec chmod 755 {} +
            sudo find "$TARGET_DIR" -type f -exec chmod 644 {} +

            # Atomic symlink swap
            sudo ln -sfn "$TARGET_DIR" /var/www/diezaster/current_tmp
            sudo mv -Tf /var/www/diezaster/current_tmp /var/www/diezaster/current

            # Keep only 5 latest releases
            cd /var/www/diezaster/releases
            sudo ls -1t | tail -n +6 | xargs -r sudo rm -rf

            # Remove staging archive
            rm -f "$ARCHIVE"
          EOF

      - name: Verify live deployment
        run: curl -fsI https://adihadiansyah.site
