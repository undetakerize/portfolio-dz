services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-diezaster_db}
      POSTGRES_USER: ${DB_USER:-diezaster_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-diezaster_secure_password_replace_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-diezaster_user} -d ${DB_NAME:-diezaster_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-diezaster_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-diezaster_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-diezaster_secure_password_replace_me}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-diezaster_db}
      DB_USERNAME: ${DB_USER:-diezaster_user}
      DB_PASSWORD: ${DB_PASSWORD:-diezaster_secure_password_replace_me}
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m -XX:+UseG1GC}"
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - internal-net

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portfolio/dist:/var/www/diezaster/current:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - internal-net

volumes:
  pgdata:

networks:
  internal-net:
    driver: bridge
